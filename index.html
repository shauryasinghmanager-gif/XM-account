<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lot Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body, #root { height: 100%; background: #020617; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; }
  @keyframes confetti-fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(420px) rotate(340deg); opacity: 0; } }
  @keyframes fade-in-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade-in-left { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes slide-down { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse-ring { 0%, 100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.35); } 50% { box-shadow: 0 0 0 10px rgba(251,191,36,0); } }
  @keyframes shimmer { 0% { background-position: -150% 0; } 100% { background-position: 250% 0; } }
  @keyframes number-pop { 0% { transform: scale(1); } 35% { transform: scale(1.1); } 100% { transform: scale(1); } }
  @keyframes blob-a { 0%, 100% { transform: translate(0,0) scale(1); } 33% { transform: translate(24px,-18px) scale(1.12); } 66% { transform: translate(-16px,14px) scale(0.94); } }
  @keyframes blob-b { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-20px,16px) scale(1.15); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .anim-fade-up { animation: fade-in-up 0.6s ease both; }
  .anim-fade-left { animation: fade-in-left 0.45s ease both; }
  .anim-slide-down { animation: slide-down 0.4s ease both; }
  .anim-pulse-ring { animation: pulse-ring 2.2s ease-in-out infinite; }
  .anim-pop { animation: number-pop 0.5s ease; }
  .anim-spin { animation: spin 0.8s linear infinite; }
  .shimmer-bar { background-image: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent); background-size: 60% 100%; animation: shimmer 2s linear infinite; }
  .blob-a { animation: blob-a 9s ease-in-out infinite; }
  .blob-b { animation: blob-b 11s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const STORAGE_KEY = "lot-tracker-account";
const START_CAPITAL = 270;

function buildMilestones() {
  const arr = [
    { capital: 270, lot: 0.01 },
    { capital: 540, lot: 0.05 },
    { capital: 1080, lot: 0.10 },
  ];
  let cap = 1080, lot = 0.10;
  for (let i = 0; i < 7; i++) {
    cap *= 2;
    lot = Number((lot * 2).toFixed(2));
    arr.push({ capital: cap, lot });
  }
  return arr;
}
const MILESTONES = buildMilestones();

function fmtMoney(n) {
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toFixed(2);
}
function fmtLot(n) { return n.toFixed(2); }

function useCountUp(value, duration = 800) {
  const [display, setDisplay] = useState(value);
  const prevRef = useRef(value);
  useEffect(() => {
    const start = prevRef.current;
    const end = value;
    if (start === end) return;
    const t0 = performance.now();
    let raf;
    function tick(now) {
      const t = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(start + (end - start) * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
      else prevRef.current = end;
    }
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value, duration]);
  return display;
}

/* ---- tiny inline icon set (no external icon package needed) ---- */
const Icon = {
  Wallet: (p) => (
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <rect x="2" y="6" width="20" height="14" rx="2" /><path d="M2 10h20" /><circle cx="16" cy="14" r="1.5" fill="currentColor" stroke="none" />
    </svg>
  ),
  Target: (p) => (
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" {...p}>
      <circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="5" /><circle cx="12" cy="12" r="1" fill="currentColor" />
    </svg>
  ),
  Up: (p) => (
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <polyline points="3 17 9 11 13 15 21 6" /><polyline points="14 6 21 6 21 13" />
    </svg>
  ),
  Down: (p) => (
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <polyline points="3 7 9 13 13 9 21 18" /><polyline points="14 18 21 18 21 11" />
    </svg>
  ),
  Plus: (p) => (
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" {...p}>
      <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
    </svg>
  ),
  Trash: (p) => (
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <polyline points="3 6 5 6 21 6" /><path d="M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0v14a1 1 0 01-1 1H7a1 1 0 01-1-1V6h12z" />
    </svg>
  ),
  Sparkle: (p) => (
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" {...p}>
      <path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6z" />
    </svg>
  ),
};

const CONFETTI_COLORS = ["#fbbf24", "#34d399", "#60a5fa", "#f472b6", "#f87171", "#c4b5fd"];

function Confetti() {
  const particles = useMemo(() => Array.from({ length: 32 }).map((_, i) => ({
    id: i, left: Math.random() * 100, color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
    delay: Math.random() * 0.5, duration: 1.6 + Math.random() * 1, size: 5 + Math.random() * 5, rot: Math.random() * 360,
  })), []);
  return (
    <div className="pointer-events-none fixed inset-0 z-50 overflow-hidden">
      {particles.map((p) => (
        <span key={p.id} style={{
          position: "absolute", left: p.left + "%", top: "-16px", width: p.size, height: p.size * 0.4,
          background: p.color, borderRadius: 1, transform: `rotate(${p.rot}deg)`,
          animation: `confetti-fall ${p.duration}s cubic-bezier(0.3,0.6,0.7,1) ${p.delay}s forwards`,
        }} />
      ))}
    </div>
  );
}

function MiniChart({ data }) {
  const pathRef = useRef(null);
  const width = 300, height = 140, pad = 10;
  const values = data.map((d) => d.balance);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const points = data.map((d, i) => {
    const x = pad + (i / (data.length - 1 || 1)) * (width - 2 * pad);
    const y = height - pad - ((d.balance - min) / range) * (height - 2 * pad);
    return [x, y];
  });
  const pathD = points.map((p, i) => (i === 0 ? "M" : "L") + p[0] + " " + p[1]).join(" ");

  useEffect(() => {
    if (!pathRef.current) return;
    const len = pathRef.current.getTotalLength();
    pathRef.current.style.transition = "none";
    pathRef.current.style.strokeDasharray = len;
    pathRef.current.style.strokeDashoffset = len;
    pathRef.current.getBoundingClientRect();
    pathRef.current.style.transition = "stroke-dashoffset 1.1s ease-out";
    pathRef.current.style.strokeDashoffset = "0";
  }, [pathD]);

  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-40">
      <path ref={pathRef} d={pathD} fill="none" stroke="#fbbf24" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function App() {
  const [trades, setTrades] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ date: new Date().toISOString().slice(0, 10), pair: "", amount: "" });
  const [confetti, setConfetti] = useState(false);
  const [toast, setToast] = useState(null);
  const [lastAddedId, setLastAddedId] = useState(null);
  const [popKey, setPopKey] = useState(0);
  const milestoneIdxRef = useRef(null);
  const amountInputRef = useRef(null);

  function jumpToAddTrade() {
    if (amountInputRef.current) {
      amountInputRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
      setTimeout(() => amountInputRef.current && amountInputRef.current.focus(), 350);
    }
  }

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setTrades(JSON.parse(raw).trades || []);
    } catch (e) {}
    setLoading(false);
  }, []);

  function persist(nextTrades) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ trades: nextTrades })); } catch (e) {}
  }

  const currentCapital = useMemo(() => trades.reduce((sum, t) => sum + t.amount, START_CAPITAL), [trades]);

  const { currentMilestone, nextMilestone, progressPct, milestoneIdx } = useMemo(() => {
    let idx = 0;
    for (let i = 0; i < MILESTONES.length; i++) if (currentCapital >= MILESTONES[i].capital) idx = i;
    const cur = MILESTONES[idx];
    const next = MILESTONES[idx + 1] || null;
    let pct = 100;
    if (next) { pct = ((currentCapital - cur.capital) / (next.capital - cur.capital)) * 100; pct = Math.max(0, Math.min(100, pct)); }
    return { currentMilestone: cur, nextMilestone: next, progressPct: pct, milestoneIdx: idx };
  }, [currentCapital]);

  useEffect(() => {
    if (loading) return;
    if (milestoneIdxRef.current === null) { milestoneIdxRef.current = milestoneIdx; return; }
    if (milestoneIdx > milestoneIdxRef.current) {
      setConfetti(true);
      setToast(`New tier unlocked — ${fmtLot(currentMilestone.lot)} lot`);
      const t1 = setTimeout(() => setConfetti(false), 2400);
      const t2 = setTimeout(() => setToast(null), 3400);
      return () => { clearTimeout(t1); clearTimeout(t2); };
    }
    milestoneIdxRef.current = milestoneIdx;
  }, [milestoneIdx, loading, currentMilestone]);

  const chartData = useMemo(() => {
    const sorted = [...trades].sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
    let running = START_CAPITAL;
    const pts = [{ label: "Start", balance: START_CAPITAL }];
    sorted.forEach((t, i) => { running += t.amount; pts.push({ label: `#${i + 1}`, balance: Number(running.toFixed(2)) }); });
    return pts;
  }, [trades]);

  const totalPnl = currentCapital - START_CAPITAL;
  const displayCapital = useCountUp(currentCapital);
  const displayPnl = useCountUp(totalPnl);
  const displayProgress = useCountUp(progressPct, 900);

  function handleAddTrade(e) {
    e.preventDefault();
    const amt = parseFloat(form.amount);
    if (isNaN(amt)) return;
    const trade = { id: Date.now(), date: form.date, pair: form.pair.trim(), amount: amt, lot: currentMilestone.lot };
    const next = [trade, ...trades];
    setTrades(next); persist(next); setLastAddedId(trade.id); setPopKey((k) => k + 1);
    setForm({ date: new Date().toISOString().slice(0, 10), pair: "", amount: "" });
  }

  function handleDelete(id) {
    const next = trades.filter((t) => t.id !== id);
    setTrades(next); persist(next);
  }

  if (loading) {
    return (
      <div className="min-h-full flex items-center justify-center bg-slate-950 p-10">
        <div className="anim-spin w-5 h-5 border-2 border-amber-400 border-t-transparent rounded-full" />
      </div>
    );
  }

  const sortedTrades = [...trades].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

  return (
    <div className="touch-manipulation min-h-full bg-slate-950 text-slate-100 relative overflow-hidden" style={{ fontFamily: "system-ui, -apple-system, sans-serif" }}>
      <div className="pointer-events-none absolute inset-0 overflow-hidden">
        <div className="blob-a absolute -top-16 -left-10 w-56 h-56 bg-amber-500/10 rounded-full blur-3xl" />
        <div className="blob-b absolute top-40 -right-16 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl" />
      </div>

      {confetti && <Confetti />}

      {toast && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 anim-slide-down">
          <div className="flex items-center gap-2 bg-amber-500 text-slate-950 text-sm font-medium px-4 py-2 rounded-full shadow-lg shadow-amber-500/30">
            <Icon.Sparkle /> {toast}
          </div>
        </div>
      )}

      <div className="sticky top-0 z-30 bg-slate-950/85 backdrop-blur border-b border-slate-800">
        <div className="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between">
          <span className="text-sm text-slate-300 tabular-nums">{fmtMoney(currentCapital)}</span>
          <span className="text-xs font-medium text-amber-400 tabular-nums bg-amber-500/10 border border-amber-500/30 rounded-full px-2.5 py-1">
            {fmtLot(currentMilestone.lot)} lot
          </span>
        </div>
      </div>

      <div className="relative max-w-md mx-auto px-4 py-6 space-y-5" style={{ paddingBottom: "max(96px, env(safe-area-inset-bottom))" }}>

        <div className="anim-fade-up bg-slate-900/80 backdrop-blur border border-slate-800 rounded-xl p-5" style={{ animationDelay: "0ms" }}>
          <div className="flex items-center gap-2 text-slate-500 text-sm mb-1"><Icon.Wallet /><span>Account balance</span></div>
          <div className="flex items-end justify-between">
            <span key={popKey} className="anim-pop inline-block text-4xl text-slate-50 tabular-nums" style={{ fontFamily: "Georgia, 'Iowan Old Style', serif" }}>
              {fmtMoney(displayCapital)}
            </span>
            <span className={"text-sm font-medium tabular-nums flex items-center gap-1 " + (totalPnl >= 0 ? "text-emerald-400" : "text-rose-400")}>
              {totalPnl >= 0 ? <Icon.Up /> : <Icon.Down />} {fmtMoney(displayPnl)}
            </span>
          </div>
          <div className="text-xs text-slate-500 mt-1">Started at {fmtMoney(START_CAPITAL)}</div>
        </div>

        <div className="anim-fade-up bg-slate-900/80 backdrop-blur border border-slate-800 rounded-xl p-5 space-y-3" style={{ animationDelay: "90ms" }}>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2 text-slate-500 text-sm"><Icon.Target /><span>Lot size right now</span></div>
            <span className="anim-pulse-ring rounded-full px-3 py-1 text-lg font-semibold text-amber-400 tabular-nums bg-amber-500/10 border border-amber-500/30">
              {fmtLot(currentMilestone.lot)} lot
            </span>
          </div>
          {nextMilestone ? (
            <>
              <div className="relative w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div className="h-full bg-amber-500 rounded-full transition-all duration-700 ease-out relative overflow-hidden" style={{ width: displayProgress + "%" }}>
                  <div className="shimmer-bar absolute inset-0" />
                </div>
              </div>
              <div className="flex justify-between text-xs text-slate-500">
                <span>{fmtMoney(currentMilestone.capital)}</span>
                <span>{fmtMoney(nextMilestone.capital - currentCapital)} to {fmtLot(nextMilestone.lot)} lot</span>
                <span>{fmtMoney(nextMilestone.capital)}</span>
              </div>
            </>
          ) : (<div className="text-xs text-slate-500">Top tier reached — nice work.</div>)}
        </div>

        <div className="anim-fade-up bg-slate-900/80 backdrop-blur border border-slate-800 rounded-xl p-5" style={{ animationDelay: "180ms" }}>
          <div className="text-slate-500 text-sm mb-3">Lot ladder</div>
          <div className="space-y-1.5">
            {MILESTONES.map((m, i) => {
              const isCurrent = m.capital === currentMilestone.capital;
              const isPast = currentCapital > m.capital && !isCurrent;
              return (
                <div key={m.capital}
                  className={"anim-fade-left flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors " + (isCurrent ? "bg-amber-500/10 border border-amber-500/30" : "border border-transparent active:bg-slate-800/50")}
                  style={{ animationDelay: `${220 + i * 45}ms` }}>
                  <span className={isCurrent ? "text-amber-300 font-medium" : isPast ? "text-slate-500" : "text-slate-400"}>{fmtMoney(m.capital)}+</span>
                  <span className={"tabular-nums " + (isCurrent ? "text-amber-300 font-medium" : isPast ? "text-slate-600" : "text-slate-500")}>{fmtLot(m.lot)} lot</span>
                </div>
              );
            })}
          </div>
        </div>

        {chartData.length > 1 && (
          <div className="anim-fade-up bg-slate-900/80 backdrop-blur border border-slate-800 rounded-xl p-5" style={{ animationDelay: "270ms" }}>
            <div className="text-slate-500 text-sm mb-3">Balance history</div>
            <MiniChart data={chartData} />
          </div>
        )}

        <form onSubmit={handleAddTrade} className="anim-fade-up bg-slate-900/80 backdrop-blur border border-slate-800 rounded-xl p-5 space-y-3" style={{ animationDelay: "360ms" }}>
          <div className="text-slate-500 text-sm">Log a trade</div>
          <div className="grid grid-cols-2 gap-3">
            <input type="date" value={form.date} onChange={(e) => setForm((f) => ({ ...f, date: e.target.value }))}
              className="touch-manipulation bg-slate-800 border border-slate-700 rounded-lg px-3 py-3 text-base text-slate-100 outline-none focus:border-amber-500 transition-colors" />
            <input type="text" placeholder="Pair (optional)" value={form.pair} onChange={(e) => setForm((f) => ({ ...f, pair: e.target.value }))}
              className="touch-manipulation bg-slate-800 border border-slate-700 rounded-lg px-3 py-3 text-base text-slate-100 outline-none focus:border-amber-500 transition-colors placeholder:text-slate-600" />
          </div>
          <input ref={amountInputRef} type="number" inputMode="decimal" step="0.01" placeholder="Result in $ (use - for a loss)" value={form.amount}
            onChange={(e) => setForm((f) => ({ ...f, amount: e.target.value }))}
            className="touch-manipulation w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-3 text-base text-slate-100 outline-none focus:border-amber-500 transition-colors placeholder:text-slate-600" required />
          <button type="submit" className="touch-manipulation w-full flex items-center justify-center gap-2 bg-amber-500 active:bg-amber-400 active:scale-95 text-slate-950 font-medium text-base rounded-lg py-3.5 transition-all">
            <Icon.Plus /> Add trade
          </button>
        </form>

        <div className="anim-fade-up bg-slate-900/80 backdrop-blur border border-slate-800 rounded-xl p-5" style={{ animationDelay: "450ms" }}>
          <div className="text-slate-500 text-sm mb-3">Trade log</div>
          {sortedTrades.length === 0 ? (
            <div className="text-sm text-slate-600 py-4 text-center">No trades yet. Add your first one above.</div>
          ) : (
            <div className="space-y-1">
              {sortedTrades.map((t) => (
                <div key={t.id} className={"flex items-center justify-between py-3 border-b border-slate-800 last:border-0 transition-colors active:bg-slate-800/40 rounded-lg px-2 -mx-2 " + (t.id === lastAddedId ? "anim-slide-down" : "")}>
                  <div className="flex flex-col">
                    <span className="text-sm text-slate-300">{t.date}{t.pair ? ` · ${t.pair}` : ""}</span>
                    <span className="text-xs text-slate-600">{fmtLot(t.lot)} lot</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className={"text-sm font-medium tabular-nums " + (t.amount >= 0 ? "text-emerald-400" : "text-rose-400")}>{fmtMoney(t.amount)}</span>
                    <button onClick={() => handleDelete(t.id)} className="touch-manipulation text-slate-700 active:text-rose-400 active:scale-90 transition-all p-2.5 -m-2.5" aria-label="Delete trade">
                      <Icon.Trash />
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      <button onClick={jumpToAddTrade} aria-label="Jump to add trade"
        className="touch-manipulation fixed z-40 right-5 bg-amber-500 active:bg-amber-400 active:scale-90 text-slate-950 rounded-full w-14 h-14 flex items-center justify-center shadow-lg shadow-amber-500/30 transition-all"
        style={{ bottom: "max(20px, env(safe-area-inset-bottom))" }}>
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
